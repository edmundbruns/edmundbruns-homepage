name: Linkprüfung Homepage
# Prüft jeden Montag früh die ganze Homepage: interne und externe Links,
# Modulzuordnung im Bereich Schulsozialarbeit, Google Fonts und Webador-Reste.
# Bei Fehlern wird der Lauf rot und GitHub schickt eine Benachrichtigung.

on:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]
    paths: ['site/**', 'tools/linkcheck_*.py']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ganze Homepage prüfen
        if: always()
        run: python3 tools/linkcheck_site.py
      - name: SOL-Module Schulsozialarbeit prüfen
        if: always()
        run: python3 tools/linkcheck_ssa.py
