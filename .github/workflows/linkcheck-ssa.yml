name: Linkprüfung Schulsozialarbeit
# Prüft jeden Montag früh alle Links der Seite Schulsozialarbeit:
# Erreichbarkeit, richtige Modulzuordnung und alte Webador-Adressen.
# Bei Fehlern wird der Lauf rot und GitHub schickt eine Benachrichtigung.

on:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]
    paths: ['site/schulsozialarbeit/**', 'tools/linkcheck_ssa.py']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Links prüfen
        run: python3 tools/linkcheck_ssa.py
