<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1f2a44; --muted:#5b6782;
    --brand:#3b5bdb; --ok:#2f9e44; --bad:#e03131; --tip:#f59f00;
    --zahlen:#3b5bdb; --logik:#0ca678; --woerter:#f76707; --schach:#1c7ed6; --quadrat:#ae3ec9;
    --r:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  button{font-family:inherit}
  header{padding:22px 16px 6px;text-align:center}
  header h1{margin:0;font-size:1.6rem}
  header p{margin:6px auto 0;color:var(--muted);max-width:560px}
  .wrap{max-width:720px;margin:0 auto;padding:0 12px 30px}
  .progress{margin:14px 0 0}
  .bar{height:10px;background:#dfe4f0;border-radius:99px;overflow:hidden}
  .bar span{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
  .progress small{display:block;text-align:center;color:var(--muted);margin-top:6px}

  .backlink{display:inline-block;margin:14px 0 0 12px;font-weight:700;color:var(--muted);text-decoration:none}
  .backlink:hover{color:var(--ink)}
  .daily{margin:16px 0;background:linear-gradient(135deg,#3b5bdb,#7048e8);color:#fff;border-radius:var(--r);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(59,91,219,.25)}
  .daily small{opacity:.85;display:block}
  .daily b{font-size:1.15rem}
  .daily button{background:#fff;color:#3b5bdb;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;white-space:nowrap}

  .filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
  .filters button{border:0;border-radius:99px;padding:7px 13px;font-weight:600;cursor:pointer;background:#e3e8f4;color:var(--ink);font-size:.9rem}
  .filters button.active{background:var(--ink);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
  .tile{background:var(--card);border:0;border-radius:14px;padding:12px;text-align:left;cursor:pointer;box-shadow:0 3px 12px rgba(31,42,68,.07);border-top:5px solid var(--c);position:relative;color:var(--ink)}
  .tile .nr{font-size:.8rem;font-weight:700;color:var(--c)}
  .tile .tt{font-weight:700;margin:2px 0 4px;line-height:1.25}
  .tile .lv{font-size:.8rem;color:var(--muted)}
  .tile.done::after{content:"✓";position:absolute;top:8px;right:10px;background:var(--ok);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}

  .card{background:var(--card);border-radius:var(--r);box-shadow:0 6px 24px rgba(31,42,68,.08);overflow:hidden;margin-top:14px}
  .card-head{color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--c)}
  .card-head h2{margin:0;font-size:1.2rem}
  .card-head .meta{font-size:.85rem;opacity:.92}
  .timer{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:1rem;cursor:pointer;min-width:90px}
  .timer.over{background:#fff;color:var(--bad)}
  .card-body{padding:18px}
  .step{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 4px}
  .task{font-size:1.05rem}
  .task ul{margin:6px 0;padding-left:20px}
  .seq{font-size:1.4rem;font-weight:700;letter-spacing:.05em;text-align:center;margin:12px 0;word-break:break-word}
  input[type=text],select{font-size:1.1rem;padding:10px 12px;border:2px solid #cfd6e6;border-radius:10px;width:100%;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--brand)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:1rem}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.tip{background:#fff4e0;color:#8a5a00}
  .btn.ghost{background:#eef1f8;color:var(--ink)}
  .hint{display:none;background:#fff4e0;border-left:4px solid var(--tip);padding:10px 12px;border-radius:8px;margin-top:12px}
  .solution{display:none;background:#e9f7ef;border-left:4px solid var(--ok);padding:10px 12px;border-radius:8px;margin-top:12px}
  .lerncheck{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:16px;padding:12px;background:#f7f8fc;border-radius:10px;font-size:.95rem}
  .lerncheck b{width:100%}
  .lerncheck label{display:flex;gap:6px;align-items:center;cursor:pointer}
  .feedback{margin-top:12px;font-weight:700;min-height:1.5em}
  .feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
  table.logic{width:100%;border-collapse:collapse;margin-top:8px}
  table.logic td{padding:6px 4px}
  table.logic td:first-child{font-weight:700;width:30%}
  .magic{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin:12px 0}
  .magic div,.magic input{width:64px;height:64px;border-radius:10px;font-size:1.6rem;font-weight:700;text-align:center}
  .magic div{display:flex;align-items:center;justify-content:center;background:#eef1f8}
  .magic input{border:2px dashed var(--quadrat);padding:0;color:var(--ink);background:#fff}
  .board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;max-width:340px;margin:12px auto;border:3px solid #6b4f2a;border-radius:6px;overflow:hidden;aspect-ratio:1}
  .sq{position:relative}
  .sq.l{background:#f0d9b5} .sq.d{background:#b58863}
  .sq svg{position:absolute;inset:4%;width:92%;height:92%}
  .sq .cf,.sq .cr{position:absolute;font-size:.6rem;font-weight:700;line-height:1}
  .sq .cf{bottom:2px;right:3px} .sq .cr{top:2px;left:3px}
  .sq.l .cf,.sq.l .cr{color:#b58863} .sq.d .cf,.sq.d .cr{color:#f0d9b5}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .choices button{padding:12px;border-radius:10px;border:2px solid #cfd6e6;background:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;color:var(--ink)}
  .choices button.sel{border-color:var(--c);background:#eef4ff}
  .navrow{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
  .hidden{display:none!important}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 30px;max-width:720px;margin:0 auto}
  footer a{color:var(--muted)}
</style>
</head>

const LV=[{k:'alle',t:'Alle Klassen'},{k:'2-4',t:'Klasse 2 bis 4',f:r=>r.lvl<=4},{k:'5-7',t:'Klasse 5 bis 7',f:r=>r.lvl>=5}];
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const solved=new Set(store.get('r5m-solved')||[]);
let cat='alle', lvl='alle', current=0, timerId=null;
const $=id=>document.getElementById(id);
const color=c=>'var(--'+c+')';
const stars=n=>'⭐'.repeat(n);
const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.!]$/,'');

function progress(){
  $('bar').style.width=(solved.size/R.length*100)+'%';
  $('progText').textContent=solved.size===R.length?'Alle '+R.length+' Rätsel gelöst! 🎉':solved.size+' von '+R.length+' Rätseln gelöst';
  store.set('r5m-solved',[...solved]);
}
function visible(){
  const lf=LV.find(x=>x.k===lvl).f;
  return R.map((r,i)=>i).filter(i=>(cat==='alle'||R[i].cat===cat)&&(!lf||lf(R[i])));
}
function renderFilters(){
  $('catFilter').innerHTML='';
  [['alle','Alle Rätsel'],...Object.entries(CATS)].forEach(([k,t])=>{
    const b=document.createElement('button');b.textContent=t;b.className=cat===k?'active':'';
    b.onclick=()=>{cat=k;renderOverview()};$('catFilter').appendChild(b);
  });
  $('lvlFilter').innerHTML='';
  LV.forEach(l=>{
    const b=document.createElement('button');b.textContent=l.t;b.className=lvl===l.k?'active':'';
    b.onclick=()=>{lvl=l.k;renderOverview()};$('lvlFilter').appendChild(b);
  });
}
function renderOverview(){
  renderFilters();
  const g=$('grid');g.innerHTML='';
  visible().forEach(i=>{
    const r=R[i],b=document.createElement('button');
    b.className='tile'+(solved.has(i)?' done':'');b.style.setProperty('--c',color(r.cat));
    b.innerHTML='<div class="nr">Nr. '+(i+1)+' · '+CATS[r.cat]+'</div><div class="tt">'+r.title+'</div><div class="lv">ab Klasse '+r.lvl+' · '+stars(r.stars)+'</div>';
    b.onclick=()=>openPuzzle(i);g.appendChild(b);
  });
  if(!g.children.length)g.innerHTML='<p style="grid-column:1/-1;text-align:center;color:var(--muted)">Keine Rätsel für diese Auswahl.</p>';
}
function board(fen){
  const rows=fen.split(' ')[0].split('/');let h='<div class="board" role="img" aria-label="Schachstellung">';
  rows.forEach((row,ri)=>{
    let f=0;
    for(const ch of row){
      if(/\d/.test(ch)){for(let k=0;k<+ch;k++){h+=sq(ri,f,'');f++;}}
      else{const id=(ch===ch.toUpperCase()?'w':'b')+ch.toUpperCase();h+=sq(ri,f,'<svg viewBox="0 0 45 45"><use href="#'+id+'"/></svg>');f++;}
    }
  });
  return h+'</div>';
  function sq(ri,f,inner){
    const rank=8-ri,file='abcdefgh'[f];
    return '<div class="sq '+((ri+f)%2===0?'l':'d')+'">'+inner+(ri===7?'<span class="cf">'+file+'</span>':'')+(f===0?'<span class="cr">'+rank+'</span>':'')+'</div>';
  }
}
function input(r){
  if(r.type==='text')return '<input type="text" id="ans" autocomplete="off" placeholder="Deine Antwort"'+(r.inputmode?' inputmode="'+r.inputmode+'"':'')+'>';
  if(r.type==='choice')return '<div class="choices" id="ans">'+r.choices.map(c=>'<button type="button">'+c+'</button>').join('')+'</div>';
  if(r.type==='select')return '<table class="logic">'+r.people.map((p,k)=>'<tr><td>'+p+'</td><td><select data-k="'+k+'"><option value="">wählen …</option>'+r.options.map(o=>'<option>'+o+'</option>').join('')+'</select></td></tr>').join('')+'</table>';
  if(r.type==='magic')return '<div class="magic">'+r.grid.map(v=>v===null?'<input type="text" inputmode="numeric" maxlength="1">':'<div>'+v+'</div>').join('')+'</div>';
}
function openPuzzle(i){
  current=i;stopTimer();
  const r=R[i],c=$('card');c.style.setProperty('--c',color(r.cat));
  c.innerHTML='<div class="card-head"><div><h2>Nr. '+(i+1)+' · '+r.title+'</h2><div class="meta">'+CATS[r.cat]+' · ab Klasse '+r.lvl+' · '+stars(r.stars)+'</div></div><button class="timer" id="timer">▶ 5:00</button></div>'+
   '<div class="card-body"><div class="step">Aufgabe</div><div class="task">'+r.task+'</div>'+(r.fen?board(r.fen):'')+input(r)+
   '<div class="row"><button class="btn primary" id="chk">Prüfen</button><button class="btn tip" id="tip">💡 Tipp</button><button class="btn ghost" id="sol">Lösung</button></div>'+
   '<div class="hint" id="hint">'+r.hint+'</div>'+
   '<div class="lerncheck"><b>Mein Lerncheck</b><label><input type="radio" name="lc"> 😀 leicht</label><label><input type="radio" name="lc"> 🙂 mittel</label><label><input type="radio" name="lc"> 🤔 knifflig</label></div>'+
   '<div class="feedback" id="fb"></div><div class="solution" id="solution">'+r.solution+'</div></div>';
  $('overview').classList.add('hidden');$('detail').classList.remove('hidden');
  if(r.type==='choice')c.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{c.querySelectorAll('.choices button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
  $('tip').onclick=()=>$('hint').style.display='block';
  $('sol').onclick=()=>$('solution').style.display='block';
  $('chk').onclick=()=>check(r,i);
  $('timer').onclick=toggleTimer;
  const ti=c.querySelector('#ans');if(ti&&ti.tagName==='INPUT')ti.addEventListener('keydown',e=>{if(e.key==='Enter')check(r,i)});
  const vis=visible(),pos=vis.indexOf(i);
  $('prev').disabled=pos<=0;
  window.scrollTo({top:0,behavior:'smooth'});
}
function check(r,i){
  const c=$('card'),fb=$('fb');let ok=false,empty=false,extra='';
  if(r.type==='text'){const v=norm($('ans').value);empty=!v;ok=r.answer.map(norm).includes(v);}
  if(r.type==='choice'){const s=c.querySelector('.choices .sel');empty=!s;ok=s&&s.textContent===r.answer;
    if(s&&!ok&&r.cat==='schach')extra=s.textContent==='Dc7'?' Das wäre Patt, nicht Matt!':' Prüfe, ob der König noch ein freies Feld hat.';}
  if(r.type==='select'){const v=[...c.querySelectorAll('select')].map(s=>s.value);empty=v.some(x=>!x);ok=v.every((x,k)=>x===r.answer[k]);}
  if(r.type==='magic'){const v=[...c.querySelectorAll('.magic input')].map(x=>x.value.trim());empty=v.some(x=>!x);ok=v.every((x,k)=>+x===r.answer[k]);}
  if(empty&&!ok){fb.className='feedback bad';fb.textContent='Fülle zuerst alles aus.';return;}
  if(ok){fb.className='feedback ok';fb.textContent='✅ Richtig! Stark geknobelt.';solved.add(i);progress();$('solution').style.display='block';stopTimer();}
  else{fb.className='feedback bad';fb.textContent='❌ Noch nicht.'+(extra||' Versuch es nochmal oder hol dir einen Tipp.');}
}
let left=300;
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}left=300;}
function toggleTimer(){
  const t=$('timer');
  if(timerId){clearInterval(timerId);timerId=null;t.textContent='▶ '+fmt(left);return;}
  if(left<=0){left=300;t.classList.remove('over');}
  t.textContent='⏸ '+fmt(left);
  timerId=setInterval(()=>{left--;t.textContent='⏸ '+fmt(left);
    if(left<=0){clearInterval(timerId);timerId=null;t.textContent='⏰ Zeit!';t.classList.add('over');}},1000);
}
$('back').onclick=()=>{stopTimer();$('detail').classList.add('hidden');$('overview').classList.remove('hidden');renderOverview();};
$('next').onclick=()=>{const v=visible();if(!v.length)return;const p=v.indexOf(current);openPuzzle(v[(p+1)%v.length]);};
$('prev').onclick=()=>{const v=visible();const p=v.indexOf(current);if(p>0)openPuzzle(v[p-1]);};

const day=Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);
const daily=day%R.length;
$('dailyTitle').textContent=R[daily].title+' ('+CATS[R[daily].cat]+')';
$('dailyBtn').onclick=()=>openPuzzle(daily);

renderOverview();progress();
})();
</script>
</body>
</html>
